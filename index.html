<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Мой Виджет</title>
    <!-- 1. Подключаем библиотеку VK Bridge -->
    <script src="https://unpkg.com/@vkontakte/vk-bridge/dist/browser.min.js"></script>
    <style>
        body { font-family: sans-serif; padding: 20px; text-align: center; }
        button { padding: 10px 20px; font-size: 16px; margin-top: 20px; cursor: pointer; }
    </style>
</head>
<body>
    <h1>Тест виджета</h1>
    <p>Нажмите кнопку ниже, чтобы добавить плагин и показать виджет.</p>
    
    <button id="startBtn">Запустить виджет</button>

    <script>
        // 2. Инициализируем VK Bridge (обязательно)
        vkBridge.send('VKWebAppInit');

        // 3. Логика работы
        document.getElementById('startBtn').addEventListener('click', async () => {
            try {
                // Сначала добавляем приложение в сообщество (если еще не добавлено)
                // ВАЖНО: Здесь VK сам спросит, в какое сообщество добавить
                const addResult = await vkBridge.send('VKWebAppAddToCommunity');
                console.log('Плагин добавлен в сообщество:', addResult);

                // Если плагин успешно добавлен, показываем виджет
                if (addResult.group_id) {
                    // ВАЖНО: Замените 123456789 на ID ВАШЕГО сообщества
                    const groupId = 243121235; 

                    const widgetCode = `return {
                        "title": "Матч дня",
                        "title_url": "https://vk.com/title_url",
                        "title_counter": 1,
                        "match": {
                            "state": "Завершён",
                            "team_a": { "icon_id": "club243121235", "name": "Спарта", "descr": "1 место" },
                            "team_b": { "icon_id": "club236409532", "name": "Феникс-Атлант", "descr": "9 место" },
                            "score": { "team_a": 4, "team_b": 3 },
                            "events": {
                                "team_a": [
                                    { "event": "⚽ Стёксов П.", "minute": 12 }
                                ],
                                "team_b": [
                                    { "event": "⚽ Орлов Р.", "minute": 3 }
                                ]
                            }
                        },
                        "more": "Подробнее",
                        "more_url": "https://vkvideo.ru/@fcspartaaaaa/playlists"
                    };`;

                    await vkBridge.send('VKWebAppShowCommunityWidgetPreviewBox', {
                        group_id: groupId,
                        type: 'match',
                        code: widgetCode
                    });
                    alert('Окно предпросмотра открыто!');
                }
            } catch (error) {
                console.error('Ошибка:', error);
                alert('Ошибка: ' + JSON.stringify(error));
            }
        });
    </script>
</body>
</html>
