<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Мой Виджет</title>
    <!-- 1. Подключаем библиотеку VK Bridge -->
    <script src="https://unpkg.com/@vkontakte/vk-bridge/dist/browser.min.js"></script>
    <style>
        body { font-family: sans-serif; padding: 20px; text-align: center; }
        button { padding: 10px 20px; font-size: 16px; margin: 10px; cursor: pointer; }
        .btn-add { background-color: #e0e0e0; border: 1px solid #ccc; }
        .btn-show { background-color: #4CAF50; color: white; border: none; }
    </style>
</head>
<body>
    <h1>Тест виджета</h1>
    <p>Шаг 1: Добавьте плагин. Шаг 2: Покажите виджет.</p>
    
    <!-- Две отдельные кнопки -->
    <div>
        <button id="addBtn" class="btn-add">1. Добавить в сообщество</button>
        <button id="showBtn" class="btn-show">2. Показать виджет</button>
    </div>

    <script>
        // 2. Инициализируем VK Bridge (обязательно)
        vkBridge.send('VKWebAppInit');

        // ВАЖНО: ID вашего сообщества
        const groupId = 41633375; 

        // Код виджета вынесен отдельно, чтобы его могли использовать обе кнопки
        const widgetCode = `return {
            "title": "Матч дня",
            "title_url": "https://vk.com/title_url",
            "title_counter": 1,
            "match": {
                "state": "Завершён",
                "team_a": { "icon_id": "id243121235", "name": "Спарта", "descr": "1 место" },
                "team_b": { "icon_id": "id236409532", "name": "Феникс-Атлант", "descr": "9 место" },
                "score": { "team_a": 4, "team_b": 3 },
                "events": {
                    "team_a": [
                        { "event": "⚽ Стёксов П.", "minute": 12 }
                    ],
                    "team_b": [
                        { "event": "⚽ Орлов Р.", "minute": 3 }
                    ]
                }
            },
            "more": "Подробнее",
            "more_url": "https://vkvideo.ru/@fcspartaaaaa/playlists"
        };`;

        // Логика для кнопки 1: Добавление в сообщество
        document.getElementById('addBtn').addEventListener('click', async () => {
            try {
                const addResult = await vkBridge.send('VKWebAppAddToCommunity');
                console.log('Плагин добавлен в сообщество:', addResult);
                alert('Плагин успешно добавлен! Теперь нажмите кнопку 2.');
            } catch (error) {
                console.error('Ошибка добавления:', error);
                // Если плагин уже добавлен, ВК может выдать ошибку User denied
                alert('Возможно, плагин уже добавлен. Попробуйте нажать кнопку 2. Детали: ' + JSON.stringify(error));
            }
        });

        // Логика для кнопки 2: Показ виджета
        document.getElementById('showBtn').addEventListener('click', async () => {
            try {
                await vkBridge.send('VKWebAppShowCommunityWidgetPreviewBox', {
                    group_id: groupId,
                    type: 'match',
                    code: widgetCode
                });
                alert('Окно предпросмотра открыто!');
            } catch (error) {
                console.error('Ошибка показа виджета:', error);
                alert('Ошибка виджета: ' + JSON.stringify(error));
            }
        });
    </script>
</body>
</html>
